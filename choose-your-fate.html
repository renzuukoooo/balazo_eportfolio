<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Choose Your Fate | Lawrence Balazo</title><style>
body{margin:0;background:#030711;color:#eaf7ff;font:16px/1.5 Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.game{width:min(760px,calc(100% - 30px));padding:28px;border:1px solid #24536a;background:#07101d;box-shadow:0 0 70px #061d2a}h1{margin:0 0 6px;color:#5de7ff}.sub{color:#91a8b8}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:10px 14px;border:1px solid #193b4c;background:#050c16}.scene{margin:24px 0;padding:22px;border:1px solid #193b4c;min-height:150px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choices button,.restart{padding:13px;border:1px solid #2d637a;background:#0b1b2b;color:#eaf7ff;cursor:pointer}.choices button:hover,.restart:hover{border-color:#5de7ff;color:#5de7ff}.log{margin-top:18px;color:#91a8b8;min-height:28px}@media(max-width:600px){.choices{grid-template-columns:1fr}.game{padding:20px}}
</style></head><body><main class="game"><h1>Choose Your Fate</h1><p class="sub">A small browser-game prototype by Lawrence P. Balazo.</p><div class="stats"><div class="stat">Health: <b id="health">100</b></div><div class="stat">Coins: <b id="coins">10</b></div><div class="stat">Score: <b id="score">0</b></div></div><section class="scene"><h2 id="title">Three doors wait in the dark.</h2><p id="text">Choose carefully. Some choices reward you, some hurt you, and one might just contain a chicken.</p></section><div class="choices"><button onclick="choose('left')">Open Left Door</button><button onclick="choose('middle')">Open Middle Door</button><button onclick="choose('chicken')">Investigate Chicken</button></div><p class="log" id="log"></p><button class="restart" onclick="restart()">Restart</button><p><a href="index.html" style="color:#5de7ff">← Back to portfolio</a></p></main><script>
let health=100,coins=10,score=0,over=false;const $=id=>document.getElementById(id);function update(){ $('health').textContent=health;$('coins').textContent=coins;$('score').textContent=score}function rnd(){return Math.floor(Math.random()*3)+1}function end(){if(score>=100){over=true;$('title').textContent='You won!';$('text').textContent='You reached 100 score and escaped the abyss.'}else if(health<=0){over=true;$('title').textContent='Game over';$('text').textContent='Your health reached zero.'}}function choose(type){if(over)return;let r=rnd();if(type==='left'){if(r===1){score+=40;$('log').textContent='The door hid a treasure. +40 score.'}else{health-=25;$('log').textContent='A trap! -25 health.'}}else if(type==='middle'){if(r===1){coins+=20;score+=20;$('log').textContent='You found coins. +20 coins, +20 score.'}else{health-=15;score+=10;$('log').textContent='A monster lunged at you. -15 health, +10 score.'}}else{if(r===1){score+=35;$('log').textContent='The chicken was surprisingly heroic. +35 score.'}else{coins+=5;$('log').textContent='The chicken gave you a coin. +5 coins.'}}update();end()}function restart(){health=100;coins=10;score=0;over=false;$('title').textContent='Three doors wait in the dark.';$('text').textContent='Choose carefully. Some choices reward you, some hurt you, and one might just contain a chicken.';$('log').textContent='';update()}update();</script></body></html>
